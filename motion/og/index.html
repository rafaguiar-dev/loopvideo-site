<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=630" />
    <title>LoopVideo · og</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; src: url(assets/geist-latin.woff2) format("woff2"); font-weight: 100 900; font-style: normal;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Geist"; src: url(assets/geist-latin-ext.woff2) format("woff2"); font-weight: 100 900; font-style: normal;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0A0C22; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0A0C22; color: #EEF0FA;
        font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #glow { position: absolute; left: 520px; top: 180px; width: 900px; height: 560px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(59,140,245,.30), rgba(122,90,240,.16) 50%, rgba(180,60,240,0)); }
      #floor { position: absolute; left: 380px; right: -200px; bottom: 0; height: 190px; perspective: 300px; perspective-origin: 50% 0%; overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 50%); }
      #grid { position: absolute; left: 0; right: 0; bottom: 0; height: 420%; transform-origin: 50% 100%; transform: rotateX(76deg);
        background-image: linear-gradient(rgba(122,176,255,.34) 2px, transparent 2px), linear-gradient(90deg, rgba(122,176,255,.28) 2px, transparent 2px);
        background-size: 80px 80px; }
      #copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand img { width: 64px; height: 64px; border-radius: 14px; display: block; }
      .brand b { font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
      h1 { margin-top: 40px; font-size: 68px; line-height: 1; letter-spacing: -.045em; font-weight: 680; }
      p { margin-top: 26px; font-size: 24px; line-height: 1.4; color: #AEB2D6; width: 520px; }
      #phone { position: absolute; left: 790px; top: 46px; width: 300px; height: 533px; }
      #screen { position: absolute; inset: 8px; border-radius: 22px; overflow: hidden; background: #121534;
        box-shadow: 0 30px 90px -20px rgba(59,140,245,.55), 0 0 0 1px rgba(122,176,255,.15); }
      #screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #ring { position: absolute; inset: 0; border-radius: 28px; padding: 3px;
        background: conic-gradient(from 0deg, #3B8CF5, #B43CF0 75%, rgba(58,64,120,.6) 75%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
      #tc { position: absolute; left: 22px; bottom: 22px; padding: 6px 12px; border-radius: 999px; background: rgba(10,12,34,.75);
        border: 1px solid rgba(58,64,120,.9); font-size: 17px; font-weight: 600; }
      #tc i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #FF5A6A; margin-right: 8px; vertical-align: 1px; }
      #tc span { color: #AEB2D6; font-weight: 500; margin-right: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1200" data-height="630">
      <div id="glow"></div>
      <div id="floor"><div id="grid"></div></div>
      <div id="copy">
        <div class="brand"><img src="assets/icone.png" alt="" /><b>LoopVideo</b></div>
        <h1>Uma foto vira o rosto da sua VSL.</h1>
        <p>E ele não para de falar. Sem emenda à vista.</p>
      </div>
      <div id="phone">
        <div id="screen"><img src="assets/medico-foto.jpg" alt="" /></div>
        <div id="ring"></div>
        <div id="tc"><i></i><span>falando há</span> 00:04:12</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 1 }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
