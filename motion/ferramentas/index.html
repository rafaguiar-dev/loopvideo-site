<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1184, height=640" />
    <title>LoopVideo · ferramentas</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1184px; height: 640px; overflow: hidden; background: #0A0C22; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0A0C22; }
      /* cada guia mostra a janela do app em 48,40 · 1184×640: recorta só ela */
      .shot { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
      .shot video, .shot img { position: absolute; left: -48px; top: -40px; width: 1280px; height: 720px; display: block; }
      #s0 { opacity: 1; }
      .still { position: absolute; left: -48px; top: -40px; width: 1280px; height: 720px; background: url(assets/imagens-f0.jpg) 0 0 / 1280px 720px no-repeat; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.2" data-width="1184" data-height="640">
      <!-- quadro inicial do guia de Imagens: fecha o loop no fim -->
      <div class="shot" id="s0"><img src="assets/imagens-f0.jpg" alt="" data-layout-allow-overflow /></div>
      <div class="shot" id="s1"><video id="v1" class="clip" src="assets/guia_imagens.mp4" data-start="0" data-duration="4" data-media-start="0" data-playback-rate="2.5" data-track-index="1" muted playsinline data-layout-allow-overflow></video></div>
      <div class="shot" id="s2"><video id="v2" class="clip" src="assets/guia_prova.mp4" data-start="3.6" data-duration="4" data-media-start="0" data-playback-rate="2.5" data-track-index="2" muted playsinline data-layout-allow-overflow></video></div>
      <div class="shot" id="s3"><video id="v3" class="clip" src="assets/guia_mockup.mp4" data-start="7.2" data-duration="4" data-media-start="0" data-playback-rate="2.5" data-track-index="1" muted playsinline data-layout-allow-overflow></video></div>
      <div class="shot" id="s4"><div class="still"></div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const IO = "power2.inOut";
      tl.set("#s1", { opacity: 1 }, 0)
        .fromTo("#s2", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IO }, 3.6)
        .set("#s1", { opacity: 0 }, 4.0)
        .fromTo("#s3", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IO }, 7.2)
        .set("#s2", { opacity: 0 }, 7.6)
        // volta ao quadro inicial de Imagens: o vídeo recomeça sem pulo
        .fromTo("#s4", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IO }, 10.8);
      tl.to({}, { duration: 0.01 }, 11.19);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
